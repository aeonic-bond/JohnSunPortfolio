<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Study</title>
    <link rel="icon" type="image/svg+xml" href="/Assets/Favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@200;300;400;500;600;900&family=Roboto:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/Live/main/tokens.css" />
    <link rel="stylesheet" href="/Live/main/typography.css" />
    <link rel="stylesheet" href="/Live/main/layout.css" />
    <link rel="stylesheet" href="/Live/navDropdown/navDropdown.css" />
    <link rel="stylesheet" href="/Live/caseStudyNav.css" />
    <link rel="stylesheet" href="/Live/caseStudyLayout.css" />
    <link rel="stylesheet" href="/Live/lightbox.css" />
  </head>
  <body>
    <main class="live-main cs-main">
      <article
        id="case-study-root"
        aria-label="Case Study"
      ></article>
    </main>
    <script>
      (function () {
        const CONTENT_PATHS = {
          torus: "/Live/torus/TorusContent.json",
          blueprint: "/Live/blueprint/BlueprintContent.json",
          studio: "/Live/studio/StudioContent.json",
          chatbot: "/Live/chatbot/ChatbotContent.json",
        };
        const id = new URLSearchParams(location.search).get("id") || "";
        const root = document.getElementById("case-study-root");
        if (root && CONTENT_PATHS[id]) {
          root.dataset.contentSrc = CONTENT_PATHS[id];
        }
      })();
    </script>
    <script src="/Live/navDropdown/navDropdown.js" defer></script>
    <script src="/Live/caseStudyNav.js" defer></script>
    <script src="/Live/caseStudyRenderer.js" defer></script>
    <script src="/Live/lightbox.js" defer></script>
  </body>
</html>
